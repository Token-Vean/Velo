name: security-checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONPATH: ${{ github.workspace }}
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Show environment
        run: |
          python --version
          python -m pip --version
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          python -c "import sys; print('PYTHONPATH entries:', sys.path[:5])"

      - name: Install dependencies and audit tools
        run: |
          # setuptools 79.0.1 está afectado por PYSEC-2026-3447.
          # Se fija el mínimo corregido antes de auditar el entorno completo.
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          python -m pip install -r requirements.txt
          if [ -f requirements-visual.txt ]; then python -m pip install -r requirements-visual.txt; fi
          python -m pip install bandit pip-audit pytest ruff

      - name: Compile check
        run: python -m compileall .

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests directory found; skipping pytest."
          fi

      - name: Bandit
        run: |
          bandit -r velo_engine run.py \
            -x .venv,build,dist,workspace,tests

      - name: Pip audit base
        run: pip-audit -r requirements.txt

      - name: Pip audit entorno resuelto
        # Audita también las dependencias transitivas realmente instaladas
        # (lxml, certifi, etc.), que -r sobre los requirements no cubre.
        run: pip-audit --skip-editable

      - name: Pip audit visual
        run: |
          if [ -f requirements-visual.txt ]; then
            pip-audit -r requirements-visual.txt
          else
            echo "requirements-visual.txt no encontrado, se omite."
          fi

      - name: Pip audit NLP
        run: |
          if [ -f requirements-nlp.txt ]; then
            pip-audit -r requirements-nlp.txt
          else
            echo "requirements-nlp.txt no encontrado, se omite."
          fi

      - name: Install Gitleaks CLI
        run: |
          curl -sSL \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan with Gitleaks CLI
        run: |
          gitleaks detect \
            --source . \
            --no-banner \
            --redact \
            --verbose
