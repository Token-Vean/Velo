name: security-checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Show environment
        run: |
          python --version
          python -m pip --version
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          python -c "import sys; print('PYTHONPATH entries:', sys.path[:5])"

      - name: Install dependencies and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ -f requirements-visual.txt ]; then python -m pip install -r requirements-visual.txt; fi
          python -m pip install bandit pip-audit pytest ruff

      - name: Compile check
        run: python -m compileall .

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests directory found; skipping pytest."
          fi

      - name: Bandit
        run: bandit -r . -x .venv,build,dist,workspace,tests

      - name: Pip audit base
        run: pip-audit -r requirements.txt

      - name: Pip audit visual
        run: |
          if [ -f requirements-visual.txt ]; then
            pip-audit -r requirements-visual.txt
          else
            echo "requirements-visual.txt no encontrado, se omite."
          fi

      - name: Pip audit NLP
        run: |
          if [ -f requirements-nlp.txt ]; then
            pip-audit -r requirements-nlp.txt
          else
            echo "requirements-nlp.txt no encontrado, se omite."
          fi

      - name: Secret scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
