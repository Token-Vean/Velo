name: security-checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONPATH: ${{ github.workspace }}
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Show environment
        run: |
          python --version
          python -m pip --version
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          python -c "import sys; print('PYTHONPATH entries:', sys.path[:5])"

      - name: Install dependencies and audit tools
        run: |
          # Mismo procedimiento que los instaladores: versiones y SHA-256
          # fijados en locks/, sin compilar paquetes fuente.
          VERIFICADO="--require-hashes --only-binary=:all:"
          python -m pip install $VERIFICADO -r locks/pip.lock
          python -m pip install $VERIFICADO -r locks/requirements.lock
          python -m pip install $VERIFICADO -r locks/requirements-visual.lock
          # setuptools 79.0.1 está afectado por PYSEC-2026-3447: el entorno
          # resuelto que audita pip-audit no debe arrastrar versiones viejas.
          python -m pip install "setuptools>=83.0.0" wheel
          # Herramientas de CI (no forman parte de la instalación de Velo).
          # ruff fijado: desde 0.16 activa reglas nuevas por defecto (UP, RUF100…)
          # y la versión sin fijar empezó a fallar sobre código sin cambios,
          # saltándose los pasos de pip-audit posteriores. Subirlo a propósito.
          python -m pip install bandit pip-audit pytest "ruff==0.15.22"

      - name: Locks coherentes con requirements*.txt
        run: python -I tools/comprobar_locks.py

      - name: Compile check
        run: python -m compileall .

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests directory found; skipping pytest."
          fi

      - name: Bandit
        run: |
          bandit -r velo_engine run.py \
            -x .venv,build,dist,workspace,tests

      - name: Pip audit base (lock)
        run: pip-audit --require-hashes --disable-pip --no-deps -r locks/requirements.lock

      - name: Pip audit entorno resuelto
        # Audita también lo realmente instalado (incluidas transitivas y pip).
        run: pip-audit --skip-editable

      - name: Pip audit visual (lock)
        run: pip-audit --require-hashes --disable-pip --no-deps -r locks/requirements-visual.lock

      - name: Pip audit NLP (lock)
        # El modelo es_core_news_md no está en PyPI (no hay avisos que
        # consultar): se audita el resto del lock.
        run: |
          python - <<'PY'
          import re
          texto = open("locks/requirements-nlp.lock", encoding="utf-8").read()
          texto = re.sub(r"(?m)^es-core-news-md @ .*(?:\n[ \t].*)*", "", texto)
          open("nlp-sin-modelo.lock", "w", encoding="utf-8").write(texto)
          PY
          pip-audit --require-hashes --disable-pip --no-deps -r nlp-sin-modelo.lock

      - name: Install Gitleaks CLI
        run: |
          curl -sSL \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan with Gitleaks CLI
        run: |
          gitleaks detect \
            --source . \
            --no-banner \
            --redact \
            --verbose
