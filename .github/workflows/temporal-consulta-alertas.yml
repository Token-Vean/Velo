name: temporal-consulta-alertas
# Temporal: lista las alertas de seguridad y audita dependencias de main y de
# la rama. Se borra después de usarlo.
on:
  push:
    paths:
      - ".github/workflows/temporal-consulta-alertas.yml"
permissions:
  contents: read
  security-events: read
  actions: read
jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Alertas de code scanning (todas las ramas)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&per_page=100" \
            --jq '.[] | [.number, .rule.id, .rule.security_severity_level // .rule.severity, .most_recent_instance.ref, .most_recent_instance.commit_sha[0:9], .most_recent_instance.location.path, (.most_recent_instance.location.start_line|tostring), .created_at] | @tsv'
      - name: Alertas del análisis del PR 24
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts?ref=refs/pull/24/merge&state=open&per_page=100" \
            --jq '.[] | [.number, .rule.id, .rule.security_severity_level // .rule.severity, .most_recent_instance.location.path, (.most_recent_instance.location.start_line|tostring), .most_recent_instance.message.text] | @tsv'
          echo "===== alertas de main que el PR cierra o mantiene"
          gh api "repos/$GITHUB_REPOSITORY/code-scanning/analyses?ref=refs/pull/24/merge&per_page=5" --jq '.[] | [.tool.name, .category, .results_count, .created_at] | @tsv'
